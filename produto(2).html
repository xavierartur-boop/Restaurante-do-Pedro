<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#e0ddda;font-family:Arial,Helvetica,sans-serif;color:#222}
.top-section{width:543px;min-height:98px;margin:16px 0 0 71px;padding:5px 2px 8px;background:#f4f6f8}
.form-section{width:431px;height:242px;margin:25px 0 0 137px;padding-top:2px;background:#f4f6f8}
.bottom-section{width:628px;min-height:107px;margin:50px 0 12px 38px;padding:5px 5px 9px;background:#f4f6f8}
h1,h2{margin:0;text-align:center;color:#1689e5;font-weight:700}.top-section h2,.bottom-section h2{font-size:13px;line-height:19px}.form-section h1{font-size:22px;line-height:30px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:7px;background:#fff;border-radius:3px;overflow:hidden}
th{height:16px;padding:2px 5px;text-align:left;background:#198ee6;color:#fff;font-weight:bold}td{height:18px;padding:3px 5px;background:#fff;border-bottom:1px solid #eee;color:#555}
.top-section th:nth-child(1){width:16%}.top-section th:nth-child(2){width:28%}.top-section th:nth-child(3){width:28%}.top-section th:nth-child(4){width:28%}
.bottom-section th:nth-child(1){width:9%}.bottom-section th:nth-child(2){width:42%}.bottom-section th:nth-child(3){width:15%}.bottom-section th:nth-child(4){width:34%}
.btn{border:0;border-radius:2px;cursor:pointer;font-family:Arial,Helvetica,sans-serif;font-size:8px}.btn-register{margin-top:8px;padding:5px 7px;background:#3c9b42;color:#fff}.btn-register:hover{background:#328638}
.form-card{width:341px;height:181px;margin:7px auto 0;padding:13px;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.09)}
.field{margin-bottom:19px}label{display:block;margin-bottom:3px;font-size:12px;font-weight:bold}
input{width:100%;height:26px;padding:4px 7px;border:1px solid #d9e2ed;border-radius:4px;background:#e9f1fc;color:#555;font-size:10px;outline:none}input:focus{border-color:#1689e5;box-shadow:0 0 0 1px #1689e5}
.actions{display:flex;align-items:center;gap:10px;margin-top:1px}.btn-save{padding:7px 13px;background:#1689e5;color:#fff;font-size:9px}.btn-save:hover{background:#0876cc}
.btn-cancel{border:0;padding:0;background:transparent;color:#1689e5;font-weight:bold;font-size:10px;cursor:pointer}.btn-cancel:hover{text-decoration:underline}
.action-link{margin-right:8px;color:#1689e5;text-decoration:none;cursor:pointer}.action-link.delete{color:#ff2b1a}.action-link:hover{text-decoration:underline}.empty{height:18px;background:#fff}
@media(max-width:700px){.top-section,.form-section,.bottom-section{margin-left:auto;margin-right:auto}.top-section{width:calc(100% - 30px)}.bottom-section{width:calc(100% - 30px)}.form-section{width:calc(100% - 40px)}.form-card{width:calc(100% - 30px)}}
</style>
</head>
<body>
<section class="top-section">
<h2>Produtos</h2>
<table><thead><tr><th>ID</th><th>Nome</th><th>Preço</th><th>Ações</th></tr></thead><tbody id="topBody"></tbody></table>
<button class="btn btn-register" onclick="focusForm()">Cadastrar Produto</button>
</section>

<section class="form-section">
<h1>Cadastrar Produto</h1>
<div class="form-card">
<form id="productForm">
<div class="field"><label for="name">Nome:</label><input id="name" type="text" value="Espaguete à Carbonara" required></div>
<div class="field"><label for="price">Preço:</label><input id="price" type="number" value="60" min="0" step="0.01" required></div>
<div class="actions"><button class="btn btn-save" type="submit">Salvar</button><button class="btn-cancel" type="button" onclick="cancelEdit()">Cancelar</button></div>
</form>
</div>
</section>

<section class="bottom-section">
<h2>Produtos</h2>
<table><thead><tr><th>ID</th><th>Nome</th><th>Preço</th><th>Ações</th></tr></thead><tbody id="bottomBody"></tbody></table>
<button class="btn btn-register" onclick="focusForm()">Cadastrar Produto</button>
</section>

<script>
const KEY="produtos_html";let editingId=null;
function load(){try{const x=localStorage.getItem(KEY);if(x)return JSON.parse(x)}catch(e){}return[{id:2,name:"Espaguete à Carbonara",price:60}]}
let products=load();
function persist(){localStorage.setItem(KEY,JSON.stringify(products))}
function money(v){return Number(v).toFixed(1)}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function renderBottom(){
 const b=document.getElementById("bottomBody");b.innerHTML="";
 products.forEach(p=>{const r=document.createElement("tr");r.innerHTML=`<td>${p.id}</td><td>${esc(p.name)}</td><td>${money(p.price)}</td><td><a class="action-link" onclick="editProduct(${p.id})">Editar</a><a class="action-link delete" onclick="deleteProduct(${p.id})">Excluir</a></td>`;b.appendChild(r)});
 if(!products.length)b.innerHTML='<tr><td colspan="4" class="empty"></td></tr>';
}
function renderTop(show=false){
 const b=document.getElementById("topBody");b.innerHTML="";
 if(!show){b.innerHTML='<tr><td colspan="4" class="empty"></td></tr>';return}
 products.forEach(p=>{const r=document.createElement("tr");r.innerHTML=`<td>${p.id}</td><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>-</td>`;b.appendChild(r)});
 if(!products.length)b.innerHTML='<tr><td colspan="4" class="empty"></td></tr>';
}
function focusForm(){document.getElementById("name").focus();window.scrollTo({top:110,behavior:"smooth"})}
document.getElementById("productForm").addEventListener("submit",e=>{
 e.preventDefault();const name=document.getElementById("name").value.trim(),price=Number(document.getElementById("price").value);
 if(!name||!Number.isFinite(price)||price<0){alert("Preencha o nome e um preço válido.");return}
 if(editingId!==null){const p=products.find(x=>x.id===editingId);if(p){p.name=name;p.price=price}editingId=null}
 else{const id=products.length?Math.max(...products.map(p=>Number(p.id)))+1:1;products.push({id,name,price})}
 persist();renderBottom();renderTop(true);resetForm();
});
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;document.getElementById("name").value=p.name;document.getElementById("price").value=p.price;focusForm()}
function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p)return;if(!confirm(`Excluir "${p.name}"?`))return;products=products.filter(x=>x.id!==id);persist();renderBottom();renderTop(true)}
function resetForm(){document.getElementById("name").value="Espaguete à Carbonara";document.getElementById("price").value="60"}
function cancelEdit(){editingId=null;resetForm()}
renderBottom();renderTop(false);
</script>
</body>
</html>
